<div class="main-content">
    <p>Devs</p>
    <div>
        <form>
            <label>SearchBar</label>
            <input type="search" [formControl]="searchCtrl">
            <ul class="suggestions" *ngIf="titleSuggestions$ | async as suggestions">
                <li *ngFor="let suggestion of suggestions" (click)="autoCompleteSuggestion(suggestion)">
                  {{ suggestion }}
                </li>
              </ul>
        </form>
    </div>
    <div class="display-area">
        <div>Select a filter</div>
        <select [value]="filterLinkedToform$.value" (change)="setFilterlinkedToForm($event)">
           <option value="studios">Studios</option>
           <option value="tags">Tags</option>
        </select>
        <form (mouseenter)="onMouseEnter()" 
        (mouseleave)="onMouseLeave()"> 
            <input type="search" [formControl]="filterCtrl" placeholder="Studio">
            <ul class="suggestions" *ngIf="filterSuggestions$ | async as suggestions">
                <li *ngFor="let suggestion of suggestions" (click)="addSuggestionToFilters(suggestion)">
                  {{ suggestion.title }}
                </li>
              </ul>
        </form>
    </div>
    <div>
        <label>number of dev per page</label>
        <select id="itemsPerPage" [formControl]="elementByPageCtrl">
            <option value=20>20</option>
            <option value=50>50</option>
            <option value=100>100</option>
         </select>
        
    <div class="list-item">
        <app-dev-list-item  *ngFor="let dev of devs$ |async"  [dev]="dev" (click)="routeToComponent(dev)"> </app-dev-list-item>
      

    </div> 
    

</div>

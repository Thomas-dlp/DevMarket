<div class="main-content">
    
    <app-title-search [searchCtrl]="searchCtrl" [suggestions$]="titleSuggestions$"></app-title-search>
    <app-filter-display  [filters]="tagFilters$.getValue()" (filtersChange)="tagFilters$.next($event)"></app-filter-display>
    <app-filter-display  [filters]="studioFilter$.getValue()" (filtersChange)="onStudioFilterDeletion()"></app-filter-display>
    <app-filter-selection [filterSelection$]="filterSelection$" (selectedFilter$)="addNewFilter($event)"></app-filter-selection>
    <app-items-per-page-filter [itemsPerPageCtrl]="itemPerpageCtrl"></app-items-per-page-filter>    
    <div>
        
        
    <div class="list-item">
        <app-dev-list-item  *ngFor="let dev of filteredDevs$ |async"  [dev]="dev" (click)="routeToComponent(dev)"> </app-dev-list-item>
      

    </div> 
    

</div>

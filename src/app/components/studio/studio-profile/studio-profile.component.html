<div class="main-content" *ngIf="profile$|async as studioProfile">
   <div class="tabs">
        <ul>
            <li  *ngFor="let tab of tabs" [ngClass]="{active: selectedTab===tab.id}" (click)="selectTab(tab.id)">
                {{tab.label}}
            </li>
        </ul>
   </div>
    
   <div class="tab-content">
        @switch (selectedTab) {
            @case(tabs[0].id){
                <app-studio-profile-settings [studioProfile$]="profile$"></app-studio-profile-settings>
            }
            @case(tabs[1].id){
               <app-studio-profile-actuality-settings></app-studio-profile-actuality-settings>
            }
            @case(tabs[2].id){
               
                <app-studio-profile-dev-settings></app-studio-profile-dev-settings>
            }
        }
   </div>
   

   


    
        
        
   

</div>

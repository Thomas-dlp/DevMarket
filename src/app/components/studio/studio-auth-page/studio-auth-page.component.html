<div class="main-content">
    <span *ngIf="!(newUser$|async)">
        <h2>Welcome back, please login!</h2>
        <form [formGroup]="authForm" autocomplete="on" >
            <label for="email">Email</label>
            <input id="email"type="email" name="email" autocomplete="email" placeholder="enter your email" [formControl]="emailCtrl" >
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="enter your password" formControlName="password" >
            <button type="submit" [disabled]="authForm.invalid" (click)="submitAuthForm()">Login</button>
        </form>
    </span>
    
    <span *ngIf="newUser$|async">
        <h2>Create new account</h2>
        <form [formGroup]="newUserForm" autocomplete="on">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="email" placeholder="enter your email" formControlName="email" >
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="new-password" placeholder="enter your password" formControlName="password">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" placeholder="confirm your password" formControlName="confirmPassword">
            <button type="submit" [disabled]="newUserForm.invalid" (click)="submitNewUserForm()">Validate</button>

        </form>
    
    </span>
    
    <div class="clickable-link" (click)="toggleForm()">{{toggleFormText}}</div>
    <div ng *ngIf="loading$|async" class="loading-spinner"></div>
    
</div>

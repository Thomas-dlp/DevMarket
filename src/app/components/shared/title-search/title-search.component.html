<p>Devs</p>
    <div class="display-area">
        <form  >
            <label>SearchBar</label>
            <input  type="search" [formControl]="searchCtrl" placeholder="Search by title...">
                <ul class="suggestions" *ngIf="suggestions$ | async as suggestions">
                    <li *ngFor="let suggestion of suggestions" (click)="autoCompleteSuggestion(suggestion)" [hidden]="searchCtrl.getRawValue().length<=1">
                        {{ suggestion }}
                    </li>
                </ul>
        </form>
    </div>
